<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0284c7">

  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%230284c7%22/><path d=%22M50 20C50 20 30 45 30 60C30 71.0457 38.9543 80 50 80C61.0457 80 70 71.0457 70 60C70 45 50 20 50 20Z%22 fill=%22white%22/></svg>">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <title>Aqua+ Fundadores Pro</title>
  <!-- Polyfill vital para evitar pantalla en blanco por el uso de process.env en el navegador -->
  <script>
    window.process = window.process || { env: {} };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- LEAFLET MAPS CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

    :root {
      --font-main: 'Plus Jakarta Sans', sans-serif;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .animate-fadeIn {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-slideUp {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    body {
      background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 100%);
      font-family: var(--font-main);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      min-height: -webkit-fill-available;
      overscroll-behavior-y: none;
    }
    
    html {
      height: -webkit-fill-available;
    }

    /* Custom Scrollbar for desktop/web view */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #bae6fd;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #7dd3fc;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .active\:scale-95:active {
      transform: scale(0.95);
      transition: transform 0.1s ease-out;
    }
    
    /* Map Styles */
    .leaflet-container {
      background: #f0f9ff !important;
      font-family: var(--font-main) !important;
      z-index: 0;
    }
    .custom-marker-icon {
        background: transparent;
        border: none;
    }
  </style>
</head>
<body class="text-slate-800">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
